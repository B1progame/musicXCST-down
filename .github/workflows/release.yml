name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build installer
        shell: powershell
        working-directory: musicxcst_downloader
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          .\scripts\build_installer.ps1

      - name: Publish GitHub release
        shell: powershell
        working-directory: musicxcst_downloader
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $asset = "dist/installer/MusicXCST-Downloader-Setup-$version.exe"
          gh release view $env:RELEASE_VERSION *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_VERSION $asset --clobber
          } else {
            gh release create $env:RELEASE_VERSION $asset --title "MusicXCST Downloader $version" --generate-notes
          }
